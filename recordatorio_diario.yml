name: Recordatorio Diario Personalizado

on:
  schedule:
    # 12:00 UTC = 6:00 AM en Guatemala (UTC-6, sin horario de verano).
    # GitHub puede retrasar los cron entre 5 y 30 minutos en horas pico.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      frase_id:
        description: 'ID de frase específica (opcional, ej. quijote_14)'
        required: false
        default: ''
      dry_run:
        description: 'Solo vista previa, sin enviar a Telegram'
        type: boolean
        required: false
        default: false

# Necesario para que el job pueda commitear historial.json de vuelta al repo.
permissions:
  contents: write

concurrency:
  group: recordatorio-diario
  cancel-in-progress: false

jobs:
  recordatorio:
    name: Enviar recordatorio
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: INFO
          TZ: America/Guatemala
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.frase_id }}" ]; then
            ARGS="$ARGS --id ${{ github.event.inputs.frase_id }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Ejecutando: python main.py $ARGS"
          python main.py $ARGS

      - name: Guardar historial (evita repetir frases)
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historial.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el historial."
          else
            git commit -m "chore: historial de recordatorios [skip ci]"
            git push
          fi

      - name: Subir logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
